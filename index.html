<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>분식사 장부 계산기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --ink: #292420;
    --sub: #8b8178;
    --line: #e9e3dc;
    --field: #f4f0eb;
    --accent: #16756a;
    --accent-ink: #ffffff;
    --accent-soft: #e3f0ee;
    --accent-line: #c4ded9;
    --money: #0e7a4e;
    --money-soft: #e5f3ec;
    --money-line: #c4e2d2;
    --warn-ink: #93540b;
    --warn-soft: #fdf3e2;
    --err-ink: #b3352b;
    --err-soft: #fdeceb;
    --err-line: #f3c9c5;
    --shadow: 0 1px 3px rgba(60, 48, 36, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1a17;
      --card: #262220;
      --ink: #ede8e2;
      --sub: #a2988e;
      --line: #3a342f;
      --field: #322d29;
      --accent: #4db3a6;
      --accent-ink: #10201d;
      --accent-soft: #223732;
      --accent-line: #35544d;
      --money: #55bd87;
      --money-soft: #21342a;
      --money-line: #34523f;
      --warn-ink: #e5a95a;
      --warn-soft: #362b1a;
      --err-ink: #ec7b71;
      --err-soft: #38221f;
      --err-line: #55322e;
      --shadow: 0 1px 3px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { text-align: center; margin: 8px 0 24px; }
  h1 {
    font-family: "Gowun Batang", "Apple SD Gothic Neo", serif;
    font-weight: 700;
    font-size: 27px;
    letter-spacing: .01em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .tagline { color: var(--sub); font-size: 13.5px; margin: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 16px;
  }

  .drop {
    border: 1.5px dashed var(--accent-line);
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 30px 16px;
    text-align: center;
    color: var(--sub);
    cursor: pointer;
    transition: filter .15s;
  }
  .drop:hover, .drop.dragover { filter: brightness(.97); }
  .drop .icon { font-size: 38px; display: block; margin-bottom: 8px; }
  .drop strong { color: var(--ink); font-weight: 500; }

  .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  button {
    font-family: inherit;
    font-size: 15px;
    border: none;
    border-radius: 11px;
    padding: 13px 14px;
    cursor: pointer;
    flex: 1;
    transition: filter .12s;
  }
  button:hover { filter: brightness(.95); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-ghost { background: var(--field); color: var(--ink); }

  #preview {
    display: none;
    width: 100%;
    border-radius: 11px;
    margin-top: 14px;
    border: 1px solid var(--line);
  }

  .status {
    display: none;
    text-align: center;
    padding: 18px 10px 6px;
    color: var(--sub);
    font-size: 14px;
  }
  .spinner {
    display: inline-block;
    width: 17px; height: 17px;
    border: 2.5px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: -3.5px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  .notice {
    display: none;
    border-radius: 11px;
    padding: 12px 14px;
    font-size: 14px;
    margin-top: 14px;
    white-space: pre-line;
  }
  .notice.error { background: var(--err-soft); border: 1px solid var(--err-line); color: var(--err-ink); }

  #resultCard { display: none; }
  .totals { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-bottom: 14px; }
  .total-box {
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    border-radius: 13px;
    padding: 15px 12px;
    text-align: center;
  }
  .total-box.money { background: var(--money-soft); border-color: var(--money-line); }
  .total-box .label { font-size: 12.5px; color: var(--sub); margin-bottom: 3px; letter-spacing: .04em; }
  .total-box .value {
    font-size: 27px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .total-box.money .value { color: var(--money); }
  .total-box .value small { font-size: 14px; font-weight: 500; margin-left: 1px; }

  .compare {
    display: none;
    font-size: 13.5px;
    border-radius: 10px;
    padding: 10px 13px;
    margin-bottom: 14px;
  }
  .compare.match { background: var(--money-soft); color: var(--money); }
  .compare.diff { background: var(--warn-soft); color: var(--warn-ink); }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 6px; text-align: center; }
  th { color: var(--sub); font-weight: 500; font-size: 12.5px; letter-spacing: .03em; }
  td { font-variant-numeric: tabular-nums; }
  td.expr { color: var(--sub); font-size: 13px; }
  td input {
    width: 66px;
    font-family: inherit;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 6px 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
    color: var(--ink);
  }
  td input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 12.5px; color: var(--sub); margin: 12px 2px 0; }

  .unit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
    color: var(--sub);
  }
  .unit-row input {
    width: 110px;
    font-family: inherit;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--field);
    color: var(--ink);
  }
  .unit-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  details.settings summary {
    cursor: pointer;
    color: var(--sub);
    font-size: 13px;
    padding: 2px 0;
  }
  .settings-body { display: grid; gap: 10px; padding-top: 12px; }
  .settings-body label { font-size: 13px; color: var(--sub); display: block; margin-bottom: 4px; }
  .settings-body input, .settings-body select {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--field);
    color: var(--ink);
  }

  footer { text-align: center; color: var(--sub); font-size: 12.5px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>분식사 장부 계산기</h1>
    <p class="tagline">일일이 세지 않아도 돼요 — 사진만 찍으면<br>장부에 적을 총수량과 합계금이 바로 나와요</p>
  </header>

  <div class="card">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="장부 사진 선택">
      <span class="icon">📷</span>
      <strong>여기를 눌러 장부 사진을 선택하세요</strong><br>
      <span style="font-size:13px">사진을 끌어다 놓아도 됩니다</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <div class="btn-row">
      <button class="btn-ghost" id="cameraBtn" type="button">📸 사진 촬영</button>
      <button class="btn-ghost" id="galleryBtn" type="button">🖼️ 앨범에서 선택</button>
    </div>
    <img id="preview" alt="선택한 장부 사진 미리보기">
    <div class="btn-row" id="analyzeRow" hidden>
      <button class="btn-primary" id="analyzeBtn" type="button">🔍 숫자 세기</button>
    </div>
    <div class="status" id="status"><span class="spinner"></span><span id="statusText">사진을 읽는 중입니다…</span></div>
    <div class="notice error" id="error"></div>
  </div>

  <div class="card" id="resultCard">
    <div class="totals">
      <div class="total-box">
        <div class="label">총수량</div>
        <div class="value" id="totalCount">0<small>개</small></div>
      </div>
      <div class="total-box money">
        <div class="label">합계금</div>
        <div class="value" id="totalAmount">0<small>원</small></div>
      </div>
    </div>
    <p class="hint" style="margin:0 2px 14px">✏️ 위 숫자를 장부 아래 <b>총수량</b>·<b>합계금</b> 칸에 그대로 적으시면 돼요.</p>
    <div class="compare" id="compare"></div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>날짜</th><th>장부에 적힌 내용</th><th>수량 (수정 가능)</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="hint">잘못 읽은 칸이 있으면 수량을 직접 고치세요. 합계가 바로 다시 계산됩니다.</p>
  </div>

  <div class="card">
    <div class="unit-row">
      <label for="unitPrice">개당 단가</label>
      <span><input type="number" id="unitPrice" value="6000" min="0" step="100"> 원</span>
    </div>
  </div>

  <div class="card">
    <details class="settings">
      <summary>⚙️ 고급 설정 (모델 · API 키)</summary>
      <div class="settings-body">
        <div>
          <label for="modelSelect">인식 모델</label>
          <select id="modelSelect">
            <option value="gemini-3.6-flash">Gemini 3.6 Flash (기본, 권장)</option>
            <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
            <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
            <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (더 정확, 느림)</option>
          </select>
        </div>
        <div>
          <label for="apiKey">Gemini API 키</label>
          <input type="text" id="apiKey" placeholder="API 키 입력" autocomplete="off">
        </div>
      </div>
    </details>
  </div>

  <footer>사진은 계산에만 쓰이고 어디에도 저장되지 않아요 🤍</footer>
</div>

<script>
// API 키는 코드에 넣지 않는다. 전달 방법:
//  1) 링크 뒤에 붙여 공유:  https://<사이트주소>/#key=<API키>
//     처음 한 번 열면 키가 그 브라우저(localStorage)에 저장되고 주소에서는 지워진다.
//  2) 또는 ⚙️ 고급 설정에서 직접 입력.
let DEFAULT_API_KEY = "";
try {
  const m = location.hash.match(/key=([^&]+)/);
  if (m) {
    DEFAULT_API_KEY = decodeURIComponent(m[1]);
    localStorage.setItem("gemini_api_key", DEFAULT_API_KEY);
    history.replaceState(null, "", location.pathname + location.search);
  }
} catch (e) {}

const $ = id => document.getElementById(id);
const drop = $("drop"), fileInput = $("fileInput"), cameraInput = $("cameraInput");
const preview = $("preview"), analyzeRow = $("analyzeRow"), analyzeBtn = $("analyzeBtn");
const statusEl = $("status"), statusText = $("statusText"), errorEl = $("error");
const resultCard = $("resultCard"), rowsEl = $("rows"), compareEl = $("compare");

let imageBase64 = null;
let writtenTotal = null;
let statusTimer = null;

try {
  $("apiKey").value = localStorage.getItem("gemini_api_key") || DEFAULT_API_KEY;
  $("unitPrice").value = localStorage.getItem("unit_price") || 6000;
  const savedModel = localStorage.getItem("model");
  if (savedModel && [...$("modelSelect").options].some(o => o.value === savedModel)) {
    $("modelSelect").value = savedModel;
  }
} catch (e) { $("apiKey").value = DEFAULT_API_KEY; }
$("apiKey").addEventListener("change", () => { try { localStorage.setItem("gemini_api_key", $("apiKey").value.trim()); } catch (e) {} });
$("unitPrice").addEventListener("input", () => { try { localStorage.setItem("unit_price", $("unitPrice").value); } catch (e) {} recalc(); });
$("modelSelect").addEventListener("change", () => { try { localStorage.setItem("model", $("modelSelect").value); } catch (e) {} });

$("cameraBtn").addEventListener("click", () => cameraInput.click());
$("galleryBtn").addEventListener("click", () => fileInput.click());
drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener("change", e => e.target.files[0] && loadImage(e.target.files[0]));
cameraInput.addEventListener("change", e => e.target.files[0] && loadImage(e.target.files[0]));
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("dragover"); });
drop.addEventListener("dragleave", () => drop.classList.remove("dragover"));
drop.addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("dragover");
  if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});

function loadImage(file) {
  hideError();
  resultCard.style.display = "none";
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    // 긴 변 2000px로 줄여서 전송 속도를 높인다
    const MAX = 2000;
    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
    imageBase64 = dataUrl.split(",")[1];
    preview.src = dataUrl;
    preview.style.display = "block";
    analyzeRow.hidden = false;
    analyzeBtn.disabled = false;
    URL.revokeObjectURL(url);
  };
  img.onerror = () => showError("이미지를 불러오지 못했어요. 다른 사진으로 시도해 주세요.");
  img.src = url;
}

function showError(msg) { errorEl.textContent = msg; errorEl.style.display = "block"; }
function hideError() { errorEl.style.display = "none"; }

const WAIT_MESSAGES = [
  "사진을 읽는 중입니다…",
  "날짜별 숫자를 하나하나 세고 있어요…",
  "손글씨를 꼼꼼히 확인하는 중이에요…",
  "덧셈식을 계산하고 있어요…",
  "거의 다 됐어요, 조금만 기다려 주세요…"
];

const PROMPT = `이 사진은 한 달치 급식(분식사) 배달 장부입니다.
표에는 날짜 1~31이 있고, 각 날짜의 조식/중식/석식 칸에 그날 배달한 개수가 손글씨로 적혀 있습니다.
손글씨는 "12", "13+1", "1+1+11", "10+1+1" 처럼 숫자 또는 덧셈식 형태입니다.

읽는 방법 (순서대로):
1. 먼저 표의 격자선(칸을 나누는 가로/세로 직선)의 위치를 파악하세요. 격자선은 글씨가 아니므로 완전히 무시합니다.
2. 셀 안의 손글씨 획만 읽으세요. 세로 격자선이 글씨에 붙어 보여서 '1'이나 '4'의 일부처럼 착각하기 쉽습니다.
   특히 '4'처럼 보이는 글자는 실제로는 '1+1'이 이어 쓰인 것이거나 격자선이 겹친 '1'인 경우가 대부분입니다. 이 장부에 '4'는 거의 나오지 않습니다.
3. 덧셈식이면 계산한 값(value)을 구하세요. 각 칸의 합계는 보통 10~20 사이입니다. 이 범위를 벗어나면 다시 읽으세요.
4. 빈 칸은 결과에 포함하지 마세요.
5. 표 아래쪽에 "총수량"이 손글씨로 적혀 있으면 그 값도 읽으세요 (없거나 안 보이면 null).

기타 주의:
- 손글씨 '1'은 획이 기울어져 '/'처럼 보일 수 있습니다.
- '+1'이 흘려 써져 '+/'나 'H'처럼 보일 수 있습니다. 문맥상 덧셈식으로 해석하세요.

반드시 JSON만 출력하세요:
{"entries":[{"day":3,"text":"12+1","value":13}],"writtenTotal":246 또는 null}`;

analyzeBtn.addEventListener("click", async () => {
  const apiKey = $("apiKey").value.trim();
  if (!apiKey) { showError("처음 받았던 링크로 다시 접속하거나, ⚙️ 고급 설정에서 API 키를 입력해 주세요."); return; }
  if (!imageBase64) { showError("먼저 장부 사진을 선택해 주세요."); return; }

  hideError();
  resultCard.style.display = "none";
  analyzeBtn.disabled = true;
  statusEl.style.display = "block";
  let i = 0;
  statusText.textContent = WAIT_MESSAGES[0];
  statusTimer = setInterval(() => {
    i = Math.min(i + 1, WAIT_MESSAGES.length - 1);
    statusText.textContent = WAIT_MESSAGES[i];
  }, 9000);

  try {
    const model = $("modelSelect").value;
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: PROMPT },
            { inline_data: { mime_type: "image/jpeg", data: imageBase64 } }
          ]
        }],
        generationConfig: {
          temperature: 0,
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              entries: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    day: { type: "INTEGER" },
                    text: { type: "STRING" },
                    value: { type: "INTEGER" }
                  },
                  required: ["day", "text", "value"]
                }
              },
              writtenTotal: { type: "INTEGER", nullable: true }
            },
            required: ["entries"]
          }
        }
      })
    });

    if (!res.ok) {
      if (res.status === 503 || res.status === 429) {
        throw new Error("지금 인식 서비스가 붐비고 있어요. 잠시 후 다시 눌러 주세요.");
      }
      if (res.status === 400 || res.status === 401 || res.status === 403) {
        throw new Error("인식 서비스 연결에 문제가 있어요. 고급 설정에서 API 키를 확인해 주세요.");
      }
      throw new Error("연결이 잠시 불안정했어요 (오류 " + res.status + "). 다시 한 번 눌러 주세요.");
    }

    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("");
    if (!text) throw new Error("결과가 비어 있어요. 다시 한 번 눌러 주세요.");
    const parsed = JSON.parse(text);
    if (!parsed.entries || !parsed.entries.length) {
      throw new Error("사진에서 숫자를 찾지 못했어요. 장부 전체가 잘 나오게 다시 찍어 주세요.");
    }
    renderResult(parsed);
  } catch (err) {
    showError(err && err.message ? err.message : "문제가 생겼어요. 다시 한 번 시도해 주세요.");
  } finally {
    clearInterval(statusTimer);
    statusEl.style.display = "none";
    analyzeBtn.disabled = false;
  }
});

function renderResult(parsed) {
  writtenTotal = Number.isFinite(parsed.writtenTotal) ? parsed.writtenTotal : null;
  const entries = parsed.entries
    .map(e => ({ day: Number(e.day), text: String(e.text ?? ""), value: Number(e.value) || 0 }))
    .filter(e => Number.isFinite(e.day))
    .sort((a, b) => a.day - b.day);

  rowsEl.textContent = "";
  for (const e of entries) {
    const tr = document.createElement("tr");
    const tdDay = document.createElement("td");
    tdDay.textContent = e.day + "일";
    const tdExpr = document.createElement("td");
    tdExpr.className = "expr";
    tdExpr.textContent = e.text;
    const tdVal = document.createElement("td");
    const inp = document.createElement("input");
    inp.type = "number";
    inp.min = "0";
    inp.value = e.value;
    inp.addEventListener("input", recalc);
    tdVal.appendChild(inp);
    tr.append(tdDay, tdExpr, tdVal);
    rowsEl.appendChild(tr);
  }
  resultCard.style.display = "block";
  recalc();
  resultCard.scrollIntoView({ behavior: "smooth" });
}

function recalc() {
  if (resultCard.style.display === "none") return;
  let total = 0;
  rowsEl.querySelectorAll("input").forEach(inp => { total += Number(inp.value) || 0; });
  const unit = Number($("unitPrice").value) || 0;

  $("totalCount").innerHTML = "";
  $("totalCount").append(total.toLocaleString("ko-KR"), Object.assign(document.createElement("small"), { textContent: "개" }));
  $("totalAmount").innerHTML = "";
  $("totalAmount").append((total * unit).toLocaleString("ko-KR"), Object.assign(document.createElement("small"), { textContent: "원" }));

  if (writtenTotal != null) {
    if (writtenTotal === total) {
      compareEl.className = "compare match";
      compareEl.textContent = "✅ 장부에 적힌 총수량 " + writtenTotal.toLocaleString("ko-KR") + "개와 일치해요!";
    } else {
      compareEl.className = "compare diff";
      compareEl.textContent = "⚠️ 장부에는 총수량이 " + writtenTotal.toLocaleString("ko-KR") + "개로 적혀 있는데, 계산 결과는 "
        + total.toLocaleString("ko-KR") + "개예요 (차이 " + Math.abs(writtenTotal - total).toLocaleString("ko-KR")
        + "개). 표에서 잘못 읽힌 칸이 없는지 확인해 주세요.";
    }
    compareEl.style.display = "block";
  } else {
    compareEl.style.display = "none";
  }
}
</script>
