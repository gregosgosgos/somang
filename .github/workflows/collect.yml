name: Collect events

on:
  schedule:
    - cron: '17 20 * * *'   # 매일 05:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 브라우저 설치 (NOL 티켓 수집용)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: 행사 데이터 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
        run: node scripts/collect.mjs
      - name: AI 분류 (새 행사만, ANTHROPIC_API_KEY 없으면 건너뜀)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            npm install --no-save --no-package-lock @anthropic-ai/sdk@0.133.0
          fi
          node scripts/classify.mjs
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add festivals/data/events.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "행사 데이터 자동 갱신 $(date -u +%Y-%m-%d)"
            # 수집하는 동안 코드가 머지됐을 수 있으므로 rebase 뒤 push (events.json 은 이 워크플로만 고친다)
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
              echo "push 실패, 재시도 $i"; sleep 5
            done
          fi
