name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/receipt-photo-counter-rlo0xj, main]
  workflow_dispatch:
  # 수집 워크플로가 데이터를 커밋하면 다시 배포 (봇 커밋은 push 이벤트를 일으키지 않음)
  workflow_run:
    workflows: [Collect events]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
